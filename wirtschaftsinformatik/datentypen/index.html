<style>
:root{
  --blue:#0081CE; --blue-d:#06629d; --navy:#15314b; --orange:#FEB137; --orange-d:#d98c0f;
  --ink:#1c2733; --muted:#5d6b7a; --line:#dbe3ea; --bg:#f3f6f9; --card:#fff;
  --ok:#1e8a4c; --ok-l:#e6f5ec; --err:#c62f2f; --err-l:#fdeaea; --warn:#a86400; --warn-l:#fff3dc;
  --zahl:#1f6fb2; --zahl-l:#eaf3fc; --text:#c8562b; --text-l:#fdf0ea; --datum:#2e8b57; --datum-l:#e9f6ee; --grund:#6a4fb3; --grund-l:#f0ecfb;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Lato,system-ui,sans-serif;font-size:18px;line-height:1.5}
button{font:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header{background:var(--navy);color:#fff;height:62px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:5px solid var(--orange)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.05em;font-size:20px;background:none;border:0;color:#fff;padding:0}
.brand small{font-weight:400;letter-spacing:0;opacity:.85;font-size:15px;border-left:1px solid rgba(255,255,255,.35);padding-left:12px;margin-left:4px}
.brand svg{width:30px;height:30px}
header .spacer{flex:1}
.hprog{display:flex;gap:6px;align-items:center;font-size:14px;opacity:.95}
.hprog i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.25);display:inline-block}
.hprog i.done{background:var(--orange)}
.hprog b{margin-left:6px;font-weight:700}
.btn.pulse{animation:pulse 1.2s ease 2}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}50%{box-shadow:0 0 0 6px rgba(254,177,55,.45)}}
@media (prefers-reduced-motion:reduce){.btn.pulse{animation:none}}
main{max-width:960px;margin:0 auto;padding:26px 20px 60px}

/* ---------- Übersicht ---------- */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 30px;margin-bottom:24px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:32px;line-height:1.2;margin:4px 0 10px;color:var(--navy)}
.kicker{font-size:14px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.hero p{margin:0 0 10px;color:#33475b}
.hero .note{font-size:15px;color:var(--muted)}
.lessons{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media (max-width:760px){.lessons{grid-template-columns:1fr}}
.lcard{position:relative;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px 20px 18px;display:flex;gap:16px;align-items:flex-start;transition:transform .15s,box-shadow .15s,border-color .15s}
.lcard:hover,.lcard:focus-visible{transform:translateY(-2px);box-shadow:0 8px 22px rgba(21,49,75,.10);border-color:var(--c);outline:none}
.lcard .ic{flex:0 0 58px;height:58px;border-radius:14px;background:var(--cl);display:grid;place-items:center}
.lcard .ic svg{width:32px;height:32px;stroke:var(--c)}
.lcard .nr{font-size:13px;font-weight:900;color:var(--c);letter-spacing:.06em;text-transform:uppercase}
.lcard h3{margin:2px 0 4px;font-size:21px;color:var(--navy)}
.lcard p{margin:0;font-size:15.5px;color:var(--muted)}
.lcard .meta{margin-top:10px;font-size:14px;color:var(--muted);display:flex;gap:12px;align-items:center}
.lcard .check{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;display:none;place-items:center;font-weight:900}
.lcard.done .check{display:grid}
.certbtn{margin-top:22px;width:100%;padding:16px;border-radius:14px;border:2px dashed var(--line);background:#fff;color:var(--muted);font-weight:700}
.certbtn.ready{border:2px solid var(--orange);background:#fff8ea;color:#7a4c00}

/* ---------- Lektion ---------- */
.lhead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.back{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:15px;color:var(--muted)}
.back:hover{border-color:var(--blue);color:var(--blue-d)}
.lhead .t{font-weight:900;color:var(--navy);font-size:20px}
.lhead .t small{display:block;font-weight:700;font-size:13px;color:var(--c);letter-spacing:.06em;text-transform:uppercase}
.steps{display:flex;gap:6px;margin:0 0 18px}
.steps i{flex:1;height:7px;border-radius:9px;background:#dde5ec;transition:background .3s}
.steps i.on{background:var(--c)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 32px;min-height:420px;animation:in .35s ease}
.card:focus{outline:none}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.card h2{margin:0 0 12px;font-size:27px;color:var(--c);line-height:1.25}
.box h4,.cols .box h4{color:var(--c)}
.dtc{font-weight:900}
.dtc.z{color:var(--zahl)} .dtc.t{color:var(--text)} .dtc.d{color:var(--datum)}
code .dtc,.dtc code{font-weight:700}
table.db.ex th{vertical-align:top}
table.db.ex .dtl{display:block;font-family:var(--mono);font-size:13px;font-weight:700;margin-top:3px}
.opt.ok .dtc,.opt.no .dtc{color:inherit}
/* Jubel */
.cheer{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 16px}
.thumb{font-size:64px;display:inline-block;animation:thumb 1.1s ease-in-out infinite;transform-origin:50% 80%}
@keyframes thumb{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-14deg) scale(1.12)}50%{transform:rotate(0) scale(1)}75%{transform:rotate(10deg) scale(1.08)}}
.cheer .bubble{background:#fff8ea;border:2px solid var(--orange);border-radius:16px;padding:10px 16px;font-weight:900;color:#7a4c00;font-size:20px;animation:pop .5s ease}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.thumb{animation:none}}
@media print{
  header,footer,.namefield,.nav,.cheer,#confetti,.noprint{display:none!important}
  html,body{background:#fff!important}
  main{padding:0;max-width:none}
  .cert{margin:0 auto;page-break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:12mm}
}
.card .lead{font-size:19px;color:#2b3b4b;margin:0 0 16px}
.card p{margin:0 0 12px}
.tag{display:inline-block;font-size:12.5px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:var(--cl);color:var(--c);margin-bottom:10px}
.tag.check{background:#fff3dc;color:#8a5a00}
.tag.demo{background:#e8f3fb;color:var(--blue-d)}
code,.mono{font-family:var(--mono);font-size:.92em}
code{background:#eef2f6;border-radius:6px;padding:1px 7px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:12px}
.btn{border:0;border-radius:11px;padding:12px 22px;font-weight:900;background:var(--c);color:#fff;font-size:17px}
.btn:hover{filter:brightness(.93)}
.btn:disabled{background:#c9d3dc;cursor:not-allowed;filter:none}
.btn.ghost{background:#fff;color:var(--muted);border:1px solid var(--line)}
.btn.small{padding:7px 14px;font-size:15px}
.navhint{font-size:14px;color:var(--warn);min-height:20px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.box{border-radius:14px;padding:16px 18px;background:#f6f9fb;border:1px solid var(--line)}
.box h4{margin:0 0 6px;font-size:18px}
.merke{border:2px solid var(--orange);background:#fff8ea;border-radius:16px;padding:20px 22px;font-size:20px}
.merke b.h{display:flex;align-items:center;gap:10px;color:#8a5a00;font-size:16px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.merke ul{margin:6px 0 0;padding-left:22px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
@media (max-width:760px){.three{grid-template-columns:1fr}}
.three .g{border-radius:14px;padding:16px;border:2px solid var(--gc);background:var(--gl)}
.three .g svg{width:34px;height:34px;stroke:var(--gc)}
.three .g h4{margin:6px 0 4px;color:var(--gc);font-size:19px}
.three .g p{margin:0;font-size:15.5px}
.analog{display:flex;gap:18px;align-items:center;margin:14px 0 18px;flex-wrap:wrap}
.analog .it{display:flex;align-items:center;gap:10px;background:#f6f9fb;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:16px}
.analog svg{width:36px;height:36px}

/* Tabelle mit Spalten zum Anklicken */
table.db{border-collapse:separate;border-spacing:0;width:100%;font-size:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.db th,table.db td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}
table.db tr:last-child td{border-bottom:0}
table.db th{background:#eef3f7}
table.db th button{all:unset;cursor:pointer;font-weight:900;color:var(--navy);display:flex;flex-direction:column;gap:3px}
table.db th button:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}
table.db th .dt{font-family:var(--mono);font-size:13px;font-weight:700;border-radius:6px;padding:2px 7px;background:#fff;border:1px dashed #9db0c2;color:#9db0c2}
table.db th.rev .dt{border-style:solid;color:#fff}
table.db td.hl{background:#fbfdff}
.reveal{margin-top:12px;min-height:54px;font-size:16.5px}

/* Eingabe-Demo */
.demo{border:2px solid #cfe3f3;background:#f7fbfe;border-radius:16px;padding:18px 20px;margin-top:6px}
.demo .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.demo label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:4px}
.demo input[type=text],.demo input[type=number],.demo select{font:inherit;font-family:var(--mono);font-size:18px;padding:9px 12px;border:1.5px solid #b6c6d4;border-radius:10px;background:#fff;min-width:0}
.demo input:focus,.demo select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,129,206,.18)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid #b6c6d4;background:#fff;border-radius:99px;padding:4px 12px;font-family:var(--mono);font-size:15px}
.chip:hover{border-color:var(--blue);color:var(--blue-d)}
.out{margin-top:14px;border-radius:12px;padding:12px 16px;font-size:16.5px;display:none}
.out.on{display:block;animation:in .25s ease}
.out.ok{background:var(--ok-l);border:1.5px solid var(--ok)}
.out.err{background:var(--err-l);border:1.5px solid var(--err)}
.out.warn{background:var(--warn-l);border:1.5px solid var(--warn)}
.out .h{font-weight:900}
.out.ok .h{color:var(--ok)} .out.err .h{color:var(--err)} .out.warn .h{color:var(--warn)}
.big{font-family:var(--mono);font-size:30px;font-weight:700;margin:4px 0}
.pipe{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:6px}
.pipe .arrow{font-size:26px;color:var(--muted)}
.pill{font-family:var(--mono);font-weight:700;font-size:22px;padding:6px 14px;border-radius:10px;background:#fff;border:1.5px solid #b6c6d4}
.pill.res{border-color:var(--c);background:var(--cl)}

/* Zellen-Visualisierung */
.cells{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.cells span{width:30px;height:38px;border:1.5px solid #8aa0b5;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-size:17px;background:#fff}
.cells span.pad{background:#e6ebf0;border-style:dashed;color:#9aa8b5}
.cells span.len{background:var(--text-l);border-color:var(--text);color:var(--text);font-size:12px;font-weight:700}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
@media (max-width:760px){.vgrid{grid-template-columns:1fr}}
.vbox{border-radius:12px;border:1.5px solid var(--line);padding:12px 14px;background:#fff}
.vbox h5{margin:0 0 4px;font-size:17px;font-family:var(--mono)}
.vbox .foot{font-size:15px;color:var(--muted)}

/* Summen-Demo */
.sumbar{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.sumbar .s{border-radius:14px;padding:14px 16px;border:2px solid var(--line);background:#fff}
.sumbar .s h5{margin:0;font-size:18px;font-family:var(--mono)}
.sumbar .s .v{font-family:var(--mono);font-size:19px;word-break:break-all;margin:6px 0}
.sumbar .s .e{font-size:26px;font-weight:900}
.sumbar .bad{border-color:var(--err);background:var(--err-l)} .sumbar .good{border-color:var(--ok);background:var(--ok-l)}
input[type=range]{width:100%;accent-color:var(--zahl)}

/* DECIMAL-Baukasten */
.digits{display:flex;gap:5px;align-items:flex-end;margin:12px 0 6px;flex-wrap:wrap}
.digits span{width:38px;height:48px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-size:22px;font-weight:700;border:2px solid var(--zahl);background:var(--zahl-l);color:var(--zahl)}
.digits span.frac{border-color:var(--orange-d);background:#fff3dc;color:#8a5a00}
.digits .comma{font-size:34px;font-weight:900;color:var(--ink);width:auto;border:0;background:none;padding:0 2px;height:auto}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1.5px solid #b6c6d4;background:#fff;font-weight:900;font-size:20px}
.stepper output{font-family:var(--mono);font-size:22px;font-weight:700;min-width:30px;text-align:center}

/* Checks */
.opts{display:grid;gap:10px;margin-top:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;font-size:17.5px}
.opt:hover{border-color:var(--c)}
.opt .k{flex:0 0 30px;height:30px;border-radius:8px;background:#eef2f6;display:grid;place-items:center;font-weight:900;font-size:15px;color:var(--muted)}
.opt.ok{border-color:var(--ok);background:var(--ok-l)} .opt.ok .k{background:var(--ok);color:#fff}
.opt.no{border-color:var(--err);background:var(--err-l)} .opt.no .k{background:var(--err);color:#fff}
.fb{margin-top:12px;border-radius:12px;padding:12px 16px;font-size:16.5px;display:none}
.fb.on{display:block;animation:in .25s ease}
.fb.ok{background:var(--ok-l);border-left:0;border:1.5px solid var(--ok)}
.fb.no{background:var(--err-l);border:1.5px solid var(--err)}
.sortlist{display:grid;gap:10px;margin-top:6px}
.srow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff}
.srow .v{font-size:17px}
.srow .v small{display:block;color:var(--muted);font-size:14px}
.srow .gb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.srow .gb button{border:1.5px solid #b6c6d4;background:#fff;border-radius:9px;padding:6px 12px;font-size:15px;font-weight:700}
.srow .gb button:hover{border-color:var(--blue)}
.srow.ok{border-color:var(--ok);background:var(--ok-l)}
.srow.ok .gb button.sel{background:var(--ok);border-color:var(--ok);color:#fff}
.srow.no{border-color:var(--err);background:var(--err-l)}
.srow.no .gb button.sel{background:var(--err);border-color:var(--err);color:#fff}
.srow .why{grid-column:1/-1;font-size:15px;display:none}
.srow.ok .why,.srow.no .why{display:block}
.score{font-weight:900;color:var(--c);margin-top:10px}

/* Abschluss / Zertifikat */
.finished{text-align:center;padding:20px 10px}
.finished .medal{width:110px;height:110px;margin:0 auto 10px;border-radius:50%;background:var(--cl);display:grid;place-items:center;animation:pop .5s ease}
.finished .medal svg{width:58px;height:58px;stroke:var(--c)}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.cert{max-width:760px;margin:0 auto;background:#fff;border:10px solid var(--navy);outline:3px solid var(--orange);outline-offset:-18px;border-radius:6px;padding:46px 40px;text-align:center}
.cert h1{margin:6px 0;font-size:34px;color:var(--navy)}
.cert .name{font-size:30px;font-weight:900;color:var(--blue-d);border-bottom:2px solid var(--line);display:inline-block;min-width:60%;padding:4px 10px;margin:12px 0}
.cert .badges{display:flex;justify-content:center;gap:14px;margin:18px 0;flex-wrap:wrap}
.cert .badges div{width:120px;font-size:13.5px;color:var(--muted)}
.cert .badges span{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px}
.cert .badges svg{width:30px;height:30px}
.namefield{display:flex;gap:10px;justify-content:center;margin:16px 0}
.namefield input{font:inherit;padding:10px 14px;border:1.5px solid #b6c6d4;border-radius:10px;min-width:280px}
@media (max-width:600px){.brand small{display:none}.brand{font-size:16px}header{padding:0 14px}.card{padding:22px 18px}.card h2{font-size:23px}}
footer{max-width:960px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:13.5px}
</style>

<body>
<header>
  <button class="brand" id="home" aria-label="Zur Übersicht der DataCraft-Academy">
    <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2"><path d="M16 3 28 10v12L16 29 4 22V10z"/><path d="M16 3v13l12 6M16 16 4 22"/></svg>
    DATACRAFT ACADEMY<small>Datenbanken kompakt</small>
  </button>
  <div class="spacer"></div>
  <div class="hprog" id="hprog" aria-label="Fortschritt"></div>
</header>
<main id="app" aria-live="polite"></main>
<footer>DataCraft-Academy · interne Schulung · Datenbanksystem: MySQL</footer>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- Icons ----------
const IC = {
  db:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v6.5c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8V5.5"/><path d="M4.5 12v6.5c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8V12"/></svg>',
  num:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"/></svg>',
  txt:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/><circle cx="16" cy="16" r="2.5"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  bulb:'<svg viewBox="0 0 24 24" fill="none" stroke="#8a5a00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>',
  can:'<svg viewBox="0 0 40 40" fill="none" stroke="#0081CE" stroke-width="2" stroke-linejoin="round"><ellipse cx="20" cy="8" rx="11" ry="3"/><path d="M9 8v24c0 1.7 4.9 3 11 3s11-1.3 11-3V8"/><path d="M9 16c0 1.7 4.9 3 11 3s11-1.3 11-3M9 25c0 1.7 4.9 3 11 3s11-1.3 11-3"/><path d="M20 21.5c1.6 2 2.4 3.3 2.4 4.3a2.4 2.4 0 0 1-4.8 0c0-1 .8-2.3 2.4-4.3z" fill="#0081CE" stroke="none"/></svg>',
  box:'<svg viewBox="0 0 40 40" fill="none" stroke="#c8562b" stroke-width="2"><path d="M6 13l14-6 14 6v15l-14 6-14-6z"/><path d="M6 13l14 6 14-6M20 19v15"/></svg>',
};

// ---------- Fortschritt ----------
let done = {};
try { done = JSON.parse(localStorage.getItem('dca-done') || '{}') || {}; } catch (e) { done = {}; }
const save = () => { try { localStorage.setItem('dca-done', JSON.stringify(done)); } catch (e) {} };
let certName = '';
try { certName = localStorage.getItem('dca-name') || ''; } catch (e) {}

// ---------- MySQL-Verhalten (vereinfacht) ----------
const NUM = /^[+-]?(\d+\.?\d*|\.\d+)$/;
function asInt(raw){
  const v = raw.trim();
  if (v === '') return { err:'Bitte gib einen Wert ein.' };
  if (/^[+-]?\d+,\d+$/.test(v)) return { err:'Abgelehnt: In SQL schreibt man den Punkt als Dezimaltrennzeichen, nicht das Komma.' };
  if (!NUM.test(v)) return { err:`Abgelehnt: „${esc(v)}“ ist keine Zahl. In eine INT-Spalte passen nur ganze Zahlen.` };
  const n = Number(v), r = Math.sign(n) * Math.round(Math.abs(n));
  const notes = [];
  if (/^[+-]?0\d/.test(v)) notes.push('Die führende Null ist weg! Eine ganze Zahl beginnt nie mit einer 0.');
  if (v.includes('.') && r !== n) notes.push('INT kennt keine Nachkommastellen, deshalb wurde gerundet.');
  if (Math.abs(r) > 2147483647) return { err:'Abgelehnt: Diese Zahl ist zu groß für INT (Wertebereich ca. ±2,1 Milliarden).' };
  return { val:String(r), notes };
}
const validDate = (y,m,d) => m >= 1 && m <= 12 && d >= 1 && d <= new Date(Date.UTC(y, m, 0)).getUTCDate();
const pad = n => String(n).padStart(2,'0');
function asDate(kind, raw){
  const v = raw.trim();
  const german = /^\d{1,2}\.\d{1,2}\.\d{2,4}/.test(v) || /uhr/i.test(v);
  const fmt = { DATE:'JJJJ-MM-TT, z. B. 2025-11-21', TIME:'hh:mm:ss, z. B. 10:15:30', DATETIME:'JJJJ-MM-TT hh:mm:ss, z. B. 2025-11-21 10:15:30' }[kind];
  const fail = () => ({ err:(german ? 'Abgelehnt: Die deutsche Schreibweise versteht die Datenbank nicht. ' : 'Abgelehnt: Ungültiger Wert. ') + `Richtig ist: <b>${fmt}</b>` });
  if (kind === 'DATE'){ const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(v); if (!m || !validDate(+m[1],+m[2],+m[3])) return fail(); return { val:`${m[1]}-${pad(m[2])}-${pad(m[3])}` }; }
  if (kind === 'TIME'){ const m = /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(v); if (!m || +m[1] > 23 || +m[2] > 59 || (m[3] && +m[3] > 59)) return fail(); return { val:`${pad(m[1])}:${m[2]}:${m[3]||'00'}` }; }
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(v);
  if (!m || !validDate(+m[1],+m[2],+m[3]) || +m[4] > 23 || +m[5] > 59 || (m[6] && +m[6] > 59)) return fail();
  return { val:`${m[1]}-${pad(m[2])}-${pad(m[3])} ${pad(m[4])}:${m[5]}:${m[6]||'00'}` };
}
const out = (el, cls, head, body) => { el.className = 'out on ' + cls; el.innerHTML = `<div class="h">${head}</div>${body}`; };
const euro = x => x.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';

// ---------- Kartentypen ----------
function mcCard(c){
  return {
    html: `<span class="tag check">Mini-Check</span><h2>${c.q}</h2>${c.hint ? `<p class="lead">${c.hint}</p>` : ''}
      <div class="opts">${c.options.map((o,i) => `<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${o.t}</span></button>`).join('')}</div>
      <div class="fb" id="fb"></div>`,
    gate: true,
    init(el, unlock){
      el.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
        const o = c.options[+b.dataset.i];
        el.querySelectorAll('.opt').forEach(x => x.classList.remove('no'));
        b.classList.add(o.ok ? 'ok' : 'no');
        const fb = el.querySelector('#fb');
        fb.className = 'fb on ' + (o.ok ? 'ok' : 'no');
        fb.innerHTML = `<b>${o.ok ? 'Richtig!' : 'Noch nicht ganz.'}</b> ${o.fb}`;
        if (o.ok) { el.querySelectorAll('.opt').forEach(x => x.disabled = true); unlock(); }
      }));
    }
  };
}
function sortCard(c){
  return {
    html: `<span class="tag check">Mini-Check</span><h2>${c.q}</h2><p class="lead">${c.hint}</p>
      <div class="sortlist">${c.items.map((it,i) => `<div class="srow" data-i="${i}"><div class="v">${it.t}${it.s ? `<small>${it.s}</small>` : ''}</div>
        <div class="gb">${c.groups.map(g => `<button data-g="${g}">${g}</button>`).join('')}</div><div class="why"></div></div>`).join('')}</div>
      <div class="score" id="score"></div>`,
    gate: true,
    init(el, unlock){
      const solved = new Set();
      el.querySelectorAll('.srow').forEach(row => {
        const it = c.items[+row.dataset.i];
        row.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
          row.querySelectorAll('button').forEach(x => x.classList.remove('sel'));
          b.classList.add('sel');
          const ok = b.dataset.g === it.g;
          row.className = 'srow ' + (ok ? 'ok' : 'no');
          row.querySelector('.why').innerHTML = ok ? `✔ ${it.fb}` : `✖ Probier es noch einmal. Tipp: ${it.tip || it.fb}`;
          if (ok) { solved.add(row.dataset.i); row.querySelectorAll('button').forEach(x => x.disabled = true); }
          el.querySelector('#score').textContent = `${solved.size} von ${c.items.length} richtig`;
          if (solved.size === c.items.length) unlock();
        }));
      });
    }
  };
}
const merkeCard = (items, extra='') => ({
  html: `<span class="tag">Zusammenfassung</span><h2>Das nimmst du mit</h2>
    <div class="merke"><b class="h">${IC.bulb} Merke</b><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul></div>${extra}`
});
const info = (tag, h, body) => ({ html: `<span class="tag">${tag}</span><h2>${h}</h2>${body}` });

// ---------- Lektionen ----------
const L = [
{ id:'grundlagen', nr:1, title:'Was ist ein Datentyp?', sub:'Warum jede Spalte einen Datentyp braucht', c:'var(--grund)', cl:'var(--grund-l)', icon:IC.db, min:4,
  cards:[
  info('Lektion 1', 'Willkommen in der DataCraft-Academy!', `
    <p class="lead">Bevor eine Datenbank Daten speichern kann, muss für jede Spalte feststehen, <b>welche Art von Werten</b> dort hinein darf. Genau darum geht es in dieser Lektion.</p>
    <p>Genauso wie bei der echten Lagerhaltung gilt:</p>
    <div class="analog"><div class="it">${IC.can}<span>Öl kommt in ein Ölfass …</span></div><div class="it">${IC.box}<span>… und nicht in einen Karton.</span></div></div>
    <p>Genauso braucht jede Spalte einer Tabelle den passenden „Behälter“ für ihre Werte. Diesen Behälter nennt man <b>Datentyp</b>.</p>
    <div class="box"><b>Dein Ziel:</b> Am Ende weißt du, was ein Datentyp ist, warum er wichtig ist und welche drei Gruppen von Datentypen es gibt.</div>`),
  { html: `<span class="tag demo">Ausprobieren</span><h2>Jede Spalte hat genau einen Datentyp</h2>
    <p class="lead">Hier siehst du die Tabelle MITARBEITER. Klick nacheinander auf die vier Spaltenköpfe.</p>

  info('Erklärung', 'Was ist ein Datentyp?', `
    <p class="lead">Ein <b>Datentyp</b> legt fest, welche Art von Daten in einer Spalte einer Tabelle gespeichert werden. Er gibt also vor, welche Werte in dieser Spalte zulässig sind.</p>
    <div class="cols">
      <div class="box"><h4>Genau einer pro Spalte</h4>Jede Spalte, also jedes Attribut, erhält genau einen Datentyp. Ist er festgelegt, dürfen dort nur noch Werte dieses Typs eingetragen werden.</div>
      <div class="box"><h4>Festgelegt mit SQL</h4>SQL ist eine Datenbanksprache. Mit ihr werden Datenstrukturen definiert und Daten bearbeitet oder abgefragt. Datentypen schreibt man in SQL immer in <b>Großbuchstaben</b>:<br><code>Urlaubstage INT</code></div>

    <tbody><tr><td>Huber</td><td>2021-09-01</td><td>30</td><td>18.50</td></tr><tr><td>Yılmaz</td><td>2024-02-15</td><td>28</td><td>21.75</td></tr></tbody></table>
    <p style="font-size:15px;color:var(--muted);margin-top:8px">Was die einzelnen Datentypen bedeuten, lernst du in den nächsten Lektionen.</p>`),
  { html: `<span class="tag demo">Ausprobieren</span><h2>Der Datentyp passt auf</h2>
    <p class="lead">Die Spalte <code>Urlaubstage</code> hat einen Zahlen-Datentyp. Trag einmal <b>dreißig</b> und einmal <b>30</b> ein.</p>

    <div class="out" id="o"></div></div>`,

    init(el, unlock){

        else { out(o,'ok','✔ Gespeichert', `<div class="big">${r.val}</div>Die Datenbank kann mit diesem Wert jetzt auch rechnen, zum Beispiel alle Urlaubstage addieren.`); tried.good = true; }

  info('Erklärung', 'Warum sind Datentypen so wichtig?', `
    <div class="three" style="--gc:var(--grund);--gl:var(--grund-l)">
      <div class="g" style="--gc:var(--grund);--gl:var(--grund-l)"><h4>Einheitlich</h4><p>Die Daten werden passend und einheitlich gespeichert.</p></div>
      <div class="g" style="--gc:var(--grund);--gl:var(--grund-l)"><h4>Fehler verhindern</h4><p>Falsche oder unzulässige Eingaben werden abgelehnt.</p></div>
      <div class="g" style="--gc:var(--grund);--gl:var(--grund-l)"><h4>Richtig rechnen</h4><p>Abfragen und Berechnungen laufen sicher und korrekt.</p></div>

    <p>Welche Datentypen es genau gibt, hängt vom <b>Datenbankmanagementsystem (DBMS)</b> ab. Bei DataCraft arbeiten wir mit <b>MySQL</b>.</p>`),

  mcCard({ q:'Wie viele Datentypen hat eine Spalte?', options:[

  ]},

{ id:'zahlen', nr:2, title:'Datentypen für Zahlen', sub:'INT, FLOAT/DOUBLE und DECIMAL', c:'var(--zahl)', cl:'var(--zahl-l)', icon:IC.num, min:5,
  cards:[
  info('Lektion 2', 'Zahl ist nicht gleich Zahl', `
    <p class="lead">Für Zahlen gibt es verschiedene Datentypen. Welcher passt, hängt von zwei Fragen ab:</p>
    <div class="cols"><div class="box"><h4>1. Welche Art von Zahl?</h4>Eine ganze Zahl wie 42 oder eine Zahl mit Nachkommastellen wie 3.14?</div>
    <div class="box"><h4>2. Wie genau muss sie sein?</h4>Reicht ein ungefährer Wert, oder muss jede Stelle exakt stimmen?</div></div>
    <p style="margin-top:14px">Du lernst vier Datentypen kennen: <code>INT</code>, <code>FLOAT</code>, <code>DOUBLE</code> und <code>DECIMAL</code>.</p>`),
  { html: `<span class="tag">Ganze Zahlen</span><h2>INTEGER, kurz INT</h2>
    <p class="lead"><code>INT</code> speichert <b>ganze Zahlen</b> ohne Nachkommastellen, z. B. 5, 27 oder 1000. Typisch für ein Alter, eine Anzahl oder eine ID.</p>
    <div class="demo"><label for="iv">Probier aus, was in einer INT-Spalte landet:</label>
      <div class="row"><input id="iv" type="text" value="007" style="flex:1"><button class="btn small" id="go">In INT speichern</button></div>
      <div class="chips"><button class="chip" data-v="007">007</button><button class="chip" data-v="42">42</button><button class="chip" data-v="3.7">3.7</button><button class="chip" data-v="12a">12a</button></div>
      <div class="out" id="o"></div></div>`,
    gate:true,
    init(el, unlock){
      let n = 0;
      const go = () => { const r = asInt(el.querySelector('#iv').value), o = el.querySelector('#o');
        if (r.err) out(o,'err','✖ Abgelehnt', r.err.replace('Abgelehnt: ',''));
        else out(o, r.notes.length ? 'warn' : 'ok', r.notes.length ? '⚠ Gespeichert, aber anders als eingegeben' : '✔ Gespeichert',
          `<div class="pipe"><span class="pill">${esc(el.querySelector('#iv').value.trim())}</span><span class="arrow">→</span><span class="pill res" style="--c:var(--zahl);--cl:var(--zahl-l)">${r.val}</span></div>${r.notes.map(x => `<div style="margin-top:6px">${x}</div>`).join('')}`);
        if (++n >= 2) unlock(); };
      el.querySelector('#go').addEventListener('click', go);
      el.querySelector('#iv').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
      el.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { el.querySelector('#iv').value = c.dataset.v; go(); }));
    } },
  info('Kommazahlen', 'FLOAT und DOUBLE: Fließkommazahlen', `
    <p class="lead"><code>FLOAT</code> und <code>DOUBLE</code> speichern Zahlen <b>mit Nachkommastellen</b>, z. B. 3.14 oder 12.5. Man nennt sie Fließkomma- oder Gleitkommazahlen.</p>
    <div class="cols"><div class="box"><h4><code>FLOAT</code></h4>speichert ungenauer, ca. <b>7 Stellen</b></div><div class="box"><h4><code>DOUBLE</code></h4>speichert genauer, ca. <b>15 Stellen</b></div></div>
    <div class="box" style="margin-top:14px;background:var(--warn-l);border-color:#f0c77a"><b>Aber Vorsicht:</b> Fließkommazahlen sind flexibel, speichern viele Werte aber nur <b>ungefähr</b>. Aus <code>0.95</code> wird intern zum Beispiel <code>0.949999988</code>.</div>
    <p style="margin-top:14px">Übrigens: In SQL schreibt man den <b>Punkt</b> als Dezimaltrennzeichen: <code>12.5</code> statt 12,5.</p>`),
  { html: `<span class="tag demo">Ausprobieren</span><h2>Die Rundungsfalle</h2>
    <p class="lead">Ein Onlineshop verkauft Bleistifte für <b>0,95 €</b>. Am Monatsende addiert die Datenbank alle Verkäufe. Zieh den Regler und vergleiche.</p>
    <div class="demo"><label for="rg">Anzahl der Verkäufe: <b id="cnt">1</b></label><input type="range" id="rg" min="1" max="10000" value="1">
    <div class="sumbar"><div class="s" id="sf"><h5>FLOAT</h5><div class="v"></div><div class="e"></div></div><div class="s good" id="sd"><h5>DECIMAL</h5><div class="v"></div><div class="e"></div></div></div>
    <div id="msg" style="margin-top:10px;font-size:16px"></div></div>`,
    gate:true,
    init(el, unlock){
      const f95 = Math.fround(0.95);
      const upd = () => { const n = +el.querySelector('#rg').value; el.querySelector('#cnt').textContent = n.toLocaleString('de-DE');
        let s = 0; for (let i = 0; i < n; i++) s += f95;
        const exact = n * 95 / 100, cut = Math.floor(s * 100 + 1e-9) / 100, wrong = Math.round(cut * 100) !== n * 95;
        const sf = el.querySelector('#sf'); sf.className = 's ' + (wrong ? 'bad' : '');
        sf.querySelector('.v').textContent = s.toPrecision(15).replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');
        sf.querySelector('.e').textContent = euro(cut);
        el.querySelector('#sd .v').textContent = exact.toFixed(2); el.querySelector('#sd .e').textContent = euro(exact);
        el.querySelector('#msg').innerHTML = wrong ? `<b style="color:var(--err)">Es fehlt ein Cent!</b> Die vielen winzigen Ungenauigkeiten haben sich zu einem echten Fehler aufaddiert. Deshalb sind FLOAT und DOUBLE für Geldwerte ungeeignet.` : 'Noch stimmt alles. Erhöhe die Anzahl …';
        if (wrong) unlock(); };
      el.querySelector('#rg').addEventListener('input', upd); upd();
    } },
  { html: `<span class="tag">Exakte Zahlen</span><h2>DECIMAL(p,s): Festkommazahlen</h2>
    <p class="lead"><code>DECIMAL</code> speichert Zahlen mit einer <b>festen Anzahl an Stellen</b> vor und nach dem Komma, und zwar exakt, ohne Rundungsfehler.</p>
    <div class="cols"><div class="box"><b>p</b> (precision) = Gesamtzahl aller Ziffern</div><div class="box"><b>s</b> (scale) = Ziffern nach dem Komma</div></div>
    <div class="demo" style="margin-top:14px"><div class="row" style="gap:26px">
      <div><label>p (alle Stellen)</label><div class="stepper"><button data-d="p-">−</button><output id="p">5</output><button data-d="p+">+</button></div></div>
      <div><label>s (nach dem Komma)</label><div class="stepper"><button data-d="s-">−</button><output id="s">2</output><button data-d="s+">+</button></div></div></div>
      <div class="digits" id="dg"></div><div id="dm" style="font-size:17px"></div></div>
    <p style="margin-top:12px">DECIMAL nimmt man für <b>Währungen, Preise und genaue Messwerte</b>.</p>`,
    init(el){
      let p = 5, s = 2;
      const draw = () => { el.querySelector('#p').textContent = p; el.querySelector('#s').textContent = s;
        const ip = p - s;
        el.querySelector('#dg').innerHTML = Array.from({length:ip}, () => '<span>9</span>').join('') + (s ? '<span class="comma">,</span>' + Array.from({length:s}, () => '<span class="frac">9</span>').join('') : '');
        const max = (ip ? '9'.repeat(ip) : '0') + (s ? ',' + '9'.repeat(s) : '');
        el.querySelector('#dm').innerHTML = `<code>DECIMAL(${p},${s})</code> speichert höchstens <b>${max}</b>.`; };
      el.querySelectorAll('.stepper button').forEach(b => b.addEventListener('click', () => {
        const d = b.dataset.d;
        if (d === 'p+' && p < 12) p++; if (d === 'p-' && p > 1) { p--; if (s > p) s = p; }
        if (d === 's+' && s < p) s++; if (d === 's-' && s > 0) s--; draw(); }));
      draw();
    } },
  mcCard({ q:'Welcher Datentyp passt für den Kontostand eines Girokontos, z. B. 1.234,56 €?', options:[
    { t:'INT', fb:'INT kennt keine Nachkommastellen. Die Cents gingen verloren.' },
    { t:'FLOAT', fb:'FLOAT speichert nur ungefähr. Bei Geld können dadurch Cents fehlen.' },
    { t:'DECIMAL(8,2)', ok:true, fb:'Geld muss exakt sein: 8 Stellen, davon 2 nach dem Komma, also bis 999999,99 €.' } ] }),
  sortCard({ q:'Welcher Zahlentyp passt?', hint:'Überlege bei jedem Wert: ganze Zahl? Muss es exakt sein?', groups:['INT','FLOAT','DECIMAL'], items:[
    { t:'3', s:'Tore in einem Fußballspiel', g:'INT', fb:'Tore zählt man, das sind ganze Zahlen.' },
    { t:'4.37', s:'berechnete Durchschnittsbewertung (Sterne), exakte Stellen unwichtig', g:'FLOAT', fb:'Ein ungefährer Wert reicht hier, also FLOAT.', tip:'Hier kommt es auf exakte Stellen nicht an.' },
    { t:'89.90', s:'Preis eines Druckers in Euro', g:'DECIMAL', fb:'Preise müssen exakt sein, also DECIMAL.' },
    { t:'1300', s:'Mitarbeiter eines Unternehmens', g:'INT', fb:'Eine Anzahl ist eine ganze Zahl.' } ] }),
  mcCard({ q:'Welcher Wert ist der größte, den DECIMAL(5,2) speichern kann?', options:[
    { t:'99,99', fb:'Das wären nur 4 Stellen insgesamt. DECIMAL(5,2) hat 5.' },
    { t:'999,99', ok:true, fb:'5 Stellen insgesamt, davon 2 nach dem Komma, bleiben 3 Stellen davor.' },
    { t:'99999,99', fb:'Das wären 7 Stellen. p = 5 ist die Gesamtzahl aller Ziffern.' } ] }),
  merkeCard(['<b>INT</b> speichert ganze Zahlen. Eine führende Null geht dabei verloren.', '<b>FLOAT</b> (ca. 7 Stellen) und <b>DOUBLE</b> (ca. 15 Stellen) speichern Kommazahlen nur <b>ungefähr</b>.', '<b>DECIMAL(p,s)</b> speichert <b>exakt</b>: p = alle Stellen, s = Stellen nach dem Komma.', 'Geld und Preise gehören in DECIMAL. In SQL schreibt man den Punkt statt des Kommas.'])
  ]},

{ id:'texte', nr:3, title:'Datentypen für Texte', sub:'CHAR(n) und VARCHAR(n)', c:'var(--text)', cl:'var(--text-l)', icon:IC.txt, min:4,
  cards:[
  info('Lektion 3', 'Texte heißen Zeichenketten', `
    <p class="lead">In Datenbanken werden Texte und Wörter als <b>Zeichenketten</b> gespeichert. Eine Zeichenkette kann <b>Buchstaben, Zahlen und Sonderzeichen</b> enthalten.</p>
    <div class="analog"><div class="it"><code>Meier</code></div><div class="it"><code>Hauptstr. 12a</code></div><div class="it"><code>info@firma.de</code></div><div class="it"><code>DE</code></div></div>
    <p>Die beiden wichtigsten Datentypen dafür sind <code>CHAR</code> und <code>VARCHAR</code>. Der Unterschied liegt darin, wie sie mit der <b>Länge</b> umgehen.</p>`),
  { html: `<span class="tag demo">Ausprobieren</span><h2>CHAR und VARCHAR im Vergleich</h2>
    <p class="lead">Gib einen Text ein und wähle die Länge <b>n</b>. Sieh dir an, wie viel Platz belegt wird.</p>
    <div class="demo"><div class="row"><div style="flex:1"><label for="tx">Text</label><input id="tx" type="text" value="DE" style="width:100%"></div>
      <div><label for="nn">n</label><input id="nn" type="number" min="1" max="20" value="10" style="width:90px"></div></div>
      <div class="chips"><button class="chip" data-v="DE">DE</button><button class="chip" data-v="Meier">Meier</button><button class="chip" data-v="Schlesinger &amp; Sohn">Schlesinger &amp; Sohn</button></div>
      <div class="vgrid"><div class="vbox"><h5 style="color:var(--text)">CHAR(<span class="n"></span>)</h5><div class="cells" id="c1"></div><div class="foot" id="f1"></div></div>
      <div class="vbox"><h5 style="color:var(--text)">VARCHAR(<span class="n"></span>)</h5><div class="cells" id="c2"></div><div class="foot" id="f2"></div></div></div></div>`,
    gate:true,
    init(el, unlock){
      let changes = 0;
      const draw = () => { const t = [...el.querySelector('#tx').value], n = Math.max(1, Math.min(20, +el.querySelector('#nn').value || 1));
        el.querySelectorAll('.n').forEach(x => x.textContent = n);
        const cell = ch => `<span>${ch === ' ' ? '&nbsp;' : esc(ch)}</span>`;
        if (t.length > n) {
          const m = `<div style="color:var(--err);font-weight:700">✖ Zu lang: ${t.length} Zeichen, erlaubt sind höchstens ${n}.</div>`;
          el.querySelector('#c1').innerHTML = el.querySelector('#c2').innerHTML = ''; el.querySelector('#f1').innerHTML = el.querySelector('#f2').innerHTML = m; return; }
        el.querySelector('#c1').innerHTML = t.map(cell).join('') + Array.from({length:n - t.length}, () => '<span class="pad">·</span>').join('');
        el.querySelector('#f1').innerHTML = `belegt immer <b>${n}</b> Zeichen` + (n > t.length ? ` – davon ${n - t.length} leer` : '');
        el.querySelector('#c2').innerHTML = t.map(cell).join('');
        el.querySelector('#f2').innerHTML = `belegt nur <b>${t.length}</b> Zeichen` + (t.length < n ? ` – ${n - t.length} gespart` : '');
        if (++changes >= 3) unlock(); };
      el.querySelector('#tx').addEventListener('input', draw); el.querySelector('#nn').addEventListener('input', draw);
      el.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { el.querySelector('#tx').value = c.dataset.v.replace('&amp;','&'); draw(); }));
      draw();
    } },
  info('Erklärung', 'Wann CHAR, wann VARCHAR?', `
    <div class="cols">
      <div class="box" style="border-color:var(--text)"><h4><code>CHAR(n)</code> – feste Länge</h4>Für jede Zeichenkette werden <b>genau n Zeichen</b> reserviert. Geeignet für Daten, deren Länge <b>immer gleich</b> ist, z. B. Ländercodes wie <code>DE</code>, <code>FR</code>, <code>IT</code>, Postleitzahlen oder feste Kennungen.</div>
      <div class="box" style="border-color:var(--text)"><h4><code>VARCHAR(n)</code> – variable Länge</h4>Es wird nur so viel Speicher belegt, wie der Text braucht. <b>n</b> ist die Höchstlänge. Geeignet für Texte mit <b>unterschiedlicher Länge</b>, z. B. Namen, Adressen oder Beschreibungen.</div>

// ---------- Datentypen farbig ----------
const DT_RE = /\b(VARCHAR|CHAR|DATETIME|DATE|TIME|INTEGER|INT|FLOAT|DOUBLE|DECIMAL)(\((?:[a-z]|\d+)(?:\s*,\s*(?:[a-z]|\d+))?\))?/g;
const DT_CLASS = { VARCHAR:'t', CHAR:'t', DATETIME:'d', DATE:'d', TIME:'d', INTEGER:'z', INT:'z', FLOAT:'z', DOUBLE:'z', DECIMAL:'z' };
function colorize(root){
  if (!root || root.nodeType !== 1) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode(n){
    const p = n.parentElement; if (!p) return NodeFilter.FILTER_REJECT;
    if (p.closest('svg, input, select, option, textarea, .dtc, .gb, .big, .pill, .v, .digits, .cells, script, style')) return NodeFilter.FILTER_REJECT;
    DT_RE.lastIndex = 0; return DT_RE.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; } });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const frag = document.createDocumentFragment(); let last = 0, m; const t = n.nodeValue; DT_RE.lastIndex = 0;
    while ((m = DT_RE.exec(t))) {
      if (m.index > last) frag.appendChild(document.createTextNode(t.slice(last, m.index)));
      const sp = document.createElement('span'); sp.className = 'dtc ' + DT_CLASS[m[1]]; sp.textContent = m[0]; frag.appendChild(sp);
      last = m.index + m[0].length;
    }
    if (last < t.length) frag.appendChild(document.createTextNode(t.slice(last)));
    n.parentNode.replaceChild(frag, n);
  });
}
new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) colorize(n); else if (n.nodeType === 3 && n.parentElement) colorize(n.parentElement); })))
  .observe(document.getElementById('app'), { childList:true, subtree:true });

// ---------- Konfetti ----------
function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas'); cv.id = 'confetti'; document.body.appendChild(cv);
  const ctx = cv.getContext('2d'); const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ['#0081CE','#FEB137','#c8562b','#2e8b57','#6a4fb3','#15314b'];
  const P = Array.from({length:160}, () => ({ x:W/2 + (Math.random()-.5)*W*.3, y:H*.35, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4, s:6+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[Math.floor(Math.random()*cols.length)] }));
  let f = 0;
  (function tick(){ ctx.clearRect(0,0,W,H);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; p.vx *= .99; p.r += p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if (++f < 170) requestAnimationFrame(tick); else cv.remove(); })();
}

let cur = null, step = 0;
function go(id){ location.hash = 'lektion-' + L.find(l => l.id === id).nr; }
function lesson(l, s){
  cur = l; step = s; header();
  const c = l.cards[s], last = s === l.cards.length - 1;
  app.innerHTML = `<div style="--c:${l.c};--cl:${l.cl}">
    <div class="lhead"><button class="back" id="bk">← Übersicht</button><div class="t"><small>Lektion ${l.nr} · Schritt ${s+1} von ${l.cards.length}</small>${l.title}</div></div>
    <div class="steps" aria-hidden="true">${l.cards.map((_,i) => `<i class="${i <= s ? 'on' : ''}"></i>`).join('')}</div>
    <article class="card" id="card" tabindex="-1">${c.html}</article>
    <div class="nav"><button class="btn ghost" id="prev" ${s === 0 ? 'style="visibility:hidden"' : ''}>← Zurück</button>
      <span class="navhint" id="hint"></span>
      <button class="btn" id="next">${last ? (l.nr < 4 ? 'Lektion abschließen ✓' : 'Lektion abschließen ✓') : 'Weiter →'}</button></div></div>`;
  const next = $('#next'), hint = $('#hint');
  let open = !c.gate || c._solved;
  const unlock = () => { open = true; c._solved = true; hint.textContent = ''; next.classList.remove('pulse'); void next.offsetWidth; next.classList.add('pulse'); };
  if (c.init) c.init($('#card'), unlock);
  next.addEventListener('click', () => {
    if (!open) { hint.textContent = c.html.includes('Mini-Check') ? 'Beantworte zuerst den Mini-Check richtig.' : 'Probier die Aufgabe zuerst aus.'; return; }
    if (last) { done[l.id] = true; save(); finish(l); } else lesson(l, s + 1);
  });
  $('#prev').addEventListener('click', () => lesson(l, s - 1));
  $('#bk').addEventListener('click', () => { location.hash = ''; });
  $('#card').focus({ preventScroll:true }); window.scrollTo({ top:0 });
}
function finish(l){
  header();

  app.innerHTML = `<div style="--c:${l.c};--cl:${l.cl}"><article class="card finished">
    <div class="medal">${IC.star}</div><span class="tag">Lektion ${l.nr} abgeschlossen</span>

}
function certificate(){
  header();
  const all = L.every(l => done[l.id]);
  if (!all) { location.hash = ''; return; }
  const today = new Date().toLocaleDateString('de-DE', { day:'2-digit', month:'long', year:'numeric' });
  app.innerHTML = `
    <div class="cheer" aria-hidden="true"><span class="thumb">👍</span><span class="bubble">Super gemacht!</span><span class="thumb" style="animation-delay:.3s">👍</span></div>

    <p class="noprint" style="text-align:center;font-size:14.5px;color:var(--muted);margin:-6px 0 14px">Tipp: Wähle im Druckfenster als Drucker „Als PDF speichern“.</p>
    <div class="cert"><div class="kicker">DataCraft-Academy · Datenbanken kompakt</div>
      <h1>Zertifikat</h1><p>Hiermit wird bestätigt, dass</p>
      <div class="name" id="cn">${esc(certName) || '&nbsp;'}</div>
      <p>alle vier Lektionen zum Thema <b>Datentypen</b> erfolgreich abgeschlossen hat.</p>
      <div class="badges">${L.map(l => `<div><span style="background:${l.cl}"><span style="display:contents;--c:${l.c}">${l.icon.replace('<svg ', `<svg style="stroke:${l.c}" `)}</span></span>${l.title}</div>`).join('')}</div>
      <p style="color:var(--muted);font-size:15px">Wiesau, ${today}</p></div>
    <div class="nav" style="justify-content:center"><button class="btn ghost" id="ov" style="--c:var(--blue)">Zur Übersicht</button></div>`;
  $('#pr').addEventListener('click', () => { if (!certName.trim()) { $('#nm').focus(); $('#nm').style.borderColor = 'var(--err)'; $('#nm').placeholder = 'Bitte zuerst deinen Namen eintragen'; return; } try { window.print(); } catch (er) {} });
  confetti();
  $('#nm').addEventListener('input', e => { e.target.style.borderColor = ''; certName = e.target.value; $('#cn').innerHTML = esc(certName) || '&nbsp;'; try { localStorage.setItem('dca-name', certName); } catch (er) {} });
  $('#ov').addEventListener('click', () => { location.hash = ''; });
}
function route(){
  const h = location.hash.slice(1);
  const m = /^lektion-(\d)$/.exec(h);
  if (m) { const l = L.find(x => x.nr === +m[1]); if (l) return lesson(l, 0); }
  if (h === 'zertifikat') return certificate();
  overview();
}
$('#home').addEventListener('click', () => { location.hash = ''; route(); });
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => {
  if (!cur || !/^lektion-/.test(location.hash.slice(1))) return;
  if (['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight') $('#next') && $('#next').click();
  if (e.key === 'ArrowLeft' && step > 0) $('#prev').click();
});
route();
})();
